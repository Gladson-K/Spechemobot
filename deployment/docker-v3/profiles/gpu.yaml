# GPU override for Gazebo rendering, O3DE, and ONNX Runtime CUDA.
# Usage:
#   docker compose --profile gazebo-jazzy -f docker-compose.yaml -f profiles/gpu.yaml up -d
services:
  gazebo-jazzy:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gazebo-lyrical:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  o3de-jazzy:
